<style>
    body {
        background: black;
        color: white;
        text-align: center;
        font-family: Arial;
        margin-top: 120px;
    }

    .heart {
        font-size: 150px;
        animation: beat 1s infinite;
    }

    @keyframes beat {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.3);
        }
    }

    .text {
        font-size: 40px;
        margin: 20px;
    }
</style>
<div class="heart">❤️</div>

<div class="love-text" style="font-size: 70px;">بحبك يا نور ❤️</div>

<audio controls>
    <source src="music.mp3.mp3" type="audio/mpeg">
</audio>
<script>
function createHeart() {
    const heart = document.createElement("div");

    heart.innerHTML = "❤️";
    heart.style.position = "fixed";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.bottom = "-30px";
    heart.style.fontSize = (15 + Math.random() * 30) + "px";
    heart.style.animation = "fly 5s linear";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
<style>
@keyframes fly {
    from {
        transform: translateY(0);
        opacity: 1;
    }

    to {
        transform: translateY(-100vh);
        opacity: 0;
    }
}
</style>
